<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="stage"></canvas>
<canvas id="overlay"></canvas>
<div id="hud" class="hidden">

    <div class="brand">costuma<b>’26</b></div>
    <div class="tools">
      <button id="btn-googly" class="icon" aria-label="Googly eyes" aria-pressed="false"></button>
      <button id="btn-qr" class="icon" aria-label="Share this costume with a QR code"></button>
      <button id="btn-flip" class="icon" aria-label="Switch camera"></button>
      <button id="btn-gear" class="icon" aria-label="Settings"></button>
    </div>
  </header>
  <div class="modes" role="tablist" aria-label="Mode">
    <button id="mode-costume" role="tab" data-scene="costume">Costumes</button>
    <button id="mode-party" role="tab" data-scene="party">Party</button>
  </div>
  <div id="hint" class="hint"></div>
  <footer class="bottom">
    <div class="shutter">
      <button id="btn-snap" class="round" aria-label="Take a photo"></button>

  </footer>

<div id="toast" class="toast"></div>
<div id="dip" class="dip"></div>

    <p class="lede">Wear a 3D costume that moves with you. Point the camera at people — up to four at once — and pick who to be.</p>

<section id="settings" class="modal hidden" aria-modal="true" role="dialog">

    <button class="close" data-close aria-label="Close">✕</button>
    <h2>Settings</h2>
    <div id="settings-body"></div>
    <p id="readout" class="readout"></p>
  </div>
</section>
<section id="preview" class="modal hidden" aria-modal="true" role="dialog">
  <div class="sheet preview-sheet">
    <button class="close" data-close aria-label="Close">✕</button>
    <div id="preview-media" class="preview-media"></div>
